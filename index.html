<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#004276" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FTJM Forum" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>FTJM Forum</title>
    <script>
      // Clean up any stale or corrupted Service Worker cache before module scripts load in dev/preview
      if ('serviceWorker' in navigator) {
        var isDevOrPreview = location.hostname === 'localhost' || 
                              location.hostname === '127.0.0.1';
        if (isDevOrPreview) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) {
                caches.delete(keys[i]);
              }
            });
          }
        }
      }

      // Early recovery from stale dynamic chunk imports on version upgrades
      window.addEventListener('vite:preloadError', function(e) {
        if (e && e.preventDefault) e.preventDefault();
        var last = sessionStorage.getItem('ftjm_early_preload_reload');
        var now = Date.now();
        if (!last || now - Number(last) > 8000) {
          sessionStorage.setItem('ftjm_early_preload_reload', String(now));
          window.location.reload();
        }
      });
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? String(e.message) : '';
        if (msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('dynamically imported module') !== -1 ||
            msg.indexOf('Importing a module script failed') !== -1) {
          var last = sessionStorage.getItem('ftjm_early_chunk_reload');
          var now = Date.now();
          if (!last || now - Number(last) > 8000) {
            sessionStorage.setItem('ftjm_early_chunk_reload', String(now));
            window.location.reload();
          }
        }
      });

      // Synchronously capture password reset tokens/links before any JS SDK wipes hash/search
      try {
        var _h = window.location.hash || '';
        var _s = window.location.search || '';
        var _full = window.location.href || '';
        if (
          _h.indexOf('type=recovery') !== -1 ||
          _s.indexOf('type=recovery') !== -1 ||
          _full.indexOf('type=recovery') !== -1 ||
          _s.indexOf('reset_password=true') !== -1 ||
          _h.indexOf('reset_password=true') !== -1 ||
          (_h.indexOf('access_token=') !== -1 && _h.indexOf('recovery') !== -1)
        ) {
          sessionStorage.setItem('ftjm_pending_password_recovery', 'true');
          window.__FTJM_IS_RECOVERY__ = true;

          // If opened in a standalone tab from an email containing ais-dev-, redirect to the public ais-pre- link
          try {
            if (window.self === window.top && window.location.origin) {
              var _orig = window.location.origin;
              if (_orig.indexOf('ais-dev-') !== -1 || _orig.indexOf('-dev.') !== -1 || _orig.indexOf('-dev-') !== -1) {
                var _preHref = window.location.href
                  .replace(/ais-dev-/g, 'ais-pre-')
                  .replace(/-dev\./g, '-pre.')
                  .replace(/-dev-/g, '-pre-');
                if (_preHref !== window.location.href) {
                  window.location.replace(_preHref);
                }
              }
            }
          } catch (_) {}
        }
        if (_h.indexOf('error=') !== -1 || _s.indexOf('error=') !== -1) {
          var _raw = _h.indexOf('error=') !== -1 ? _h.substring(1) : _s.substring(1);
          var _params = new URLSearchParams(_raw);
          var _err = _params.get('error_description') || _params.get('error');
          if (_err) {
            sessionStorage.setItem('ftjm_recovery_error', _err);
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
